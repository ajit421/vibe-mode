<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0c0a09" />

    <title>Vibe Mode — Where are you right now?</title>
    <meta
      name="description"
      content="Pick where you are — Judaad House, Metro, a train, a cab, the office or your own place — and the whole website becomes that world, with the music to match."
    />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Vibe Mode" />
    <meta property="og:title" content="Vibe Mode — Where are you right now?" />
    <meta
      property="og:description"
      content="Eight little worlds and their playlists — or build your own. Pick a place, get its music."
    />
    <meta property="og:image" content="/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Vibe Mode — Where are you right now?" />
    <meta
      name="twitter:description"
      content="Eight little worlds and their playlists — or build your own. Pick a place, get its music."
    />
    <meta name="twitter:image" content="/og.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap"
      />
    </noscript>

    <!-- The site's playlists and pictures (themes/defaults.ts): fetched while the
         script downloads, so a first visit isn't left on gradients for long. -->
    <link rel="preload" href="/api/config" as="fetch" crossorigin="anonymous" />

    <link rel="preconnect" href="https://www.youtube.com" />
    <link rel="preconnect" href="https://i.ytimg.com" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="padding: 2rem; font-family: system-ui; color: #e7e5e4; background: #0c0a09">
        <h1>Vibe Mode</h1>
        <p>This site needs JavaScript to load its worlds and the music player. Please enable it.</p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
